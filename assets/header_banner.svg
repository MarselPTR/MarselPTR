<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d06" />
      <stop offset="35%" stop-color="#02210d" />
      <stop offset="65%" stop-color="#004d1c" />
      <stop offset="85%" stop-color="#002b10" />
      <stop offset="100%" stop-color="#030804" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4ffe2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ball Pattern -->
    <pattern id="ballPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="6" fill="#ffffff" />
      <polygon points="6,2 9,4 8,8 4,8 3,4" fill="#111111" />
    </pattern>
  </defs>

  <style>
    @keyframes moveAcross {
      0% {
        transform: translateX(-100px);
      }
      100% {
        transform: translateX(960px);
      }
    }

    @keyframes runLegs {
      0%, 100% {
        transform: rotate(-25deg);
      }
      50% {
        transform: rotate(30deg);
      }
    }

    @keyframes runLegsBack {
      0%, 100% {
        transform: rotate(30deg);
      }
      50% {
        transform: rotate(-25deg);
      }
    }

    @keyframes runArms {
      0%, 100% {
        transform: rotate(35deg);
      }
      50% {
        transform: rotate(-35deg);
      }
    }

    @keyframes runArmsBack {
      0%, 100% {
        transform: rotate(-35deg);
      }
      50% {
        transform: rotate(35deg);
      }
    }

    @keyframes bobBody {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes rollBall {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(720deg);
      }
    }

    @keyframes dribbleBall {
      0%, 100% {
        transform: translate(26px, -2px);
      }
      40% {
        transform: translate(32px, -8px);
      }
      70% {
        transform: translate(22px, 0px);
      }
    }

    @keyframes waveMotion {
      0% {
        d: path("M 0,210 Q 225,195 450,210 T 900,210 L 900,240 L 0,240 Z");
      }
      50% {
        d: path("M 0,205 Q 225,220 450,205 T 900,205 L 900,240 L 0,240 Z");
      }
      100% {
        d: path("M 0,210 Q 225,195 450,210 T 900,210 L 900,240 L 0,240 Z");
      }
    }

    @keyframes pulseText {
      0%, 100% {
        opacity: 0.95;
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(0,255,102,0.6));
      }
    }

    .player-track {
      animation: moveAcross 9s linear infinite;
    }

    .body-bob {
      animation: bobBody 0.4s ease-in-out infinite;
    }

    .leg-front {
      transform-origin: 15px 42px;
      animation: runLegs 0.4s ease-in-out infinite;
    }

    .leg-back {
      transform-origin: 15px 42px;
      animation: runLegsBack 0.4s ease-in-out infinite;
    }

    .arm-front {
      transform-origin: 15px 22px;
      animation: runArms 0.4s ease-in-out infinite;
    }

    .arm-back {
      transform-origin: 15px 22px;
      animation: runArmsBack 0.4s ease-in-out infinite;
    }

    .ball-container {
      animation: dribbleBall 0.8s ease-in-out infinite;
    }

    .ball-rotate {
      transform-origin: 8px 8px;
      animation: rollBall 0.6s linear infinite;
    }

    .wavy-ground {
      animation: waveMotion 6s ease-in-out infinite;
    }

    .hero-title {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      animation: pulseText 3s ease-in-out infinite;
    }

    .hero-desc {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.08" stroke="#00ff66" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
  </g>

  <!-- Ambient Light Center -->
  <ellipse cx="450" cy="110" rx="350" ry="85" fill="#00ff66" opacity="0.12" filter="url(#softGlow)" />

  <!-- Header Titles -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="450" y="92" fill="url(#textGrad)" font-size="34" class="hero-title">
      MARSEL PUTRA NUGRAHA
    </text>

    <!-- Glowing Accent Divider Line -->
    <rect x="250" y="112" width="400" height="2" rx="1" fill="url(#neonGlow)" />

    <!-- Subtitle -->
    <text x="450" y="142" fill="#00ff66" font-size="16" class="hero-desc" opacity="0.95">
      Polyglot Engineer  |  Cybersecurity Researcher  |  Code Architect
    </text>
  </g>

  <!-- Decorative Matrix Neon Stars / Particles -->
  <g fill="#00ff66">
    <circle cx="95" cy="45" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="65" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="50" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="85" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="150" r="1.8" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Waving Turf Bottom Floor -->
  <path class="wavy-ground" d="M 0,210 Q 225,195 450,210 T 900,210 L 900,240 L 0,240 Z" fill="#021a0a" opacity="0.85" />
  <path d="M 0,220 Q 225,208 450,220 T 900,220 L 900,240 L 0,240 Z" fill="#011005" />

  <!-- Neon Pitch Baseline Line -->
  <line x1="0" y1="214" x2="900" y2="214" stroke="#00ff66" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,5" />

  <!-- ============================================================ -->
  <!-- ANIMATED MESSI CHARACTER DRIBBLING BALL WALKING TO THE RIGHT -->
  <!-- ============================================================ -->
  <g class="player-track">
    <g transform="translate(0, 150)">
      
      <!-- Subtle Shadow under player -->
      <ellipse cx="20" cy="62" rx="18" ry="4" fill="#000000" opacity="0.5" />

      <!-- === CHARACTER BODY (BOBBING) === -->
      <g class="body-bob">
        
        <!-- BACK ARM -->
        <g class="arm-back">
          <!-- Upper Arm -->
          <rect x="13" y="20" width="4" height="12" rx="2" fill="#004d1c" transform="rotate(15 15 20)" />
          <!-- Forearm -->
          <rect x="15" y="30" width="3.5" height="10" rx="1.5" fill="#f1c27d" transform="rotate(-30 16 30)" />
        </g>

        <!-- BACK LEG -->
        <g class="leg-back">
          <!-- Thigh (Navy/Black Shorts) -->
          <rect x="13" y="40" width="6" height="12" rx="2" fill="#0b1118" />
          <!-- Calf (Leg skin) -->
          <rect x="14" y="50" width="4.5" height="11" rx="1.5" fill="#e0ac69" />
          <!-- Sock (White/Cyan) -->
          <rect x="14" y="55" width="4.5" height="6" fill="#75aadb" />
          <!-- Boot (Neon Green Speedflow) -->
          <path d="M 12,61 L 21,61 L 20,58 L 13,58 Z" fill="#00ff66" />
        </g>

        <!-- TORSO / JERSEY (#10 Albiceleste Stripes / Cyber Fit) -->
        <g>
          <!-- Main Jersey Base -->
          <path d="M 10,18 L 24,18 L 22,42 L 8,42 Z" fill="#75aadb" />
          <!-- White Center Stripe -->
          <rect x="13" y="18" width="4" height="24" fill="#ffffff" />
          <!-- Black Collar -->
          <path d="M 13,18 Q 16,21 19,18 Z" fill="#111111" />
          <!-- Number 10 Gold Badge -->
          <text x="15.5" y="32" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="7" fill="#ffd700" text-anchor="middle">10</text>
        </g>

        <!-- SHORTS -->
        <path d="M 8,40 L 23,40 L 22,47 L 7,47 Z" fill="#0d141e" />

        <!-- FRONT LEG -->
        <g class="leg-front">
          <!-- Thigh -->
          <rect x="11" y="40" width="6" height="12" rx="2" fill="#0d141e" />
          <!-- Calf -->
          <rect x="12" y="50" width="4.5" height="11" rx="1.5" fill="#f1c27d" />
          <!-- Sock -->
          <rect x="12" y="54" width="4.5" height="6" fill="#75aadb" />
          <!-- Boot (Neon Green Speedflow) -->
          <path d="M 11,61 L 22,61 L 20,57 L 12,57 Z" fill="#00ff66" />
        </g>

        <!-- FRONT ARM -->
        <g class="arm-front">
          <!-- Sleeve -->
          <rect x="10" y="19" width="5" height="8" rx="2" fill="#75aadb" />
          <!-- Forearm -->
          <rect x="11" y="26" width="3.5" height="11" rx="1.5" fill="#f1c27d" transform="rotate(-35 12 26)" />
          <!-- Captain Armband (Yellow/Gold) -->
          <rect x="10" y="24" width="5" height="3" fill="#ffd700" />
        </g>

        <!-- HEAD & MESSI BEARD/HAIR -->
        <g transform="translate(11, 4)">
          <!-- Neck -->
          <rect x="3" y="10" width="4" height="5" fill="#f1c27d" />
          <!-- Head Base -->
          <circle cx="5" cy="7" r="5.5" fill="#f1c27d" />
          <!-- Beard (Brown trimmed) -->
          <path d="M 5,6 Q 9,8 7,12 Q 3,12 3,9 Z" fill="#5a3825" />
          <!-- Face Profile / Nose -->
          <polygon points="9,6 11,7 9,8" fill="#e0ac69" />
          <!-- Ear -->
          <circle cx="3" cy="7" r="1.5" fill="#e0ac69" />
          <!-- Messi Signature Haircut (Brown Pompadour) -->
          <path d="M 0,5 Q 2,-1 7,-1 Q 12,1 11,5 Q 8,2 2,3 Z" fill="#3d2314" />
          <path d="M 0,5 Q -1,8 1,9 Q 2,6 2,4 Z" fill="#3d2314" />
        </g>

      </g> <!-- End body-bob -->

      <!-- === DRIBBLING SOCCER BALL === -->
      <g class="ball-container">
        <!-- Ball Shadow -->
        <ellipse cx="8" cy="62" rx="7" ry="2.5" fill="#000000" opacity="0.4" />
        
        <!-- Soccer Ball with Rotation -->
        <g class="ball-rotate" transform="translate(0, 48)">
          <!-- Outer Sphere with Border -->
          <circle cx="8" cy="8" r="7" fill="#ffffff" stroke="#111111" stroke-width="0.8" />
          <!-- Classic Pentagons -->
          <polygon points="8,3.5 10.5,5.5 9.5,8.5 6.5,8.5 5.5,5.5" fill="#111111" />
          <polygon points="8,12.5 10,10.5 12.5,11.5 11,14 8,13.5" fill="#111111" />
          <polygon points="3.5,8.5 5.5,10.5 4,13 1.5,12 2,9.5" fill="#111111" />
          <!-- Neon Green Glow Accents on Ball -->
          <circle cx="8" cy="8" r="7" fill="none" stroke="#00ff66" stroke-width="0.7" opacity="0.7" />
        </g>
        
        <!-- Light Dribble Spark / Turf Kick -->
        <circle cx="2" cy="60" r="1" fill="#00ff66" opacity="0.8" />
        <circle cx="-3" cy="58" r="0.8" fill="#00ff66" opacity="0.5" />
      </g>

    </g>
  </g>
  
</svg>
